spring:
  application:
    name: manga-reader
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  jackson:
    default-property-inclusion: non_null
  cloud:
    openfeign:
      client:
        config:
          default:
            logger-level: FULL
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          starttls:
            enabled: true
            required: true
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


app:
  profile-picture:
    max-size: 5MB
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
  security:
    token:
      activation:
        expiration: 24
      recovery:
        expiration: 1
  jwt:
    secret: ${JWT_KEY}
    access:
      expiration: ${JWT_ACCESS_EXPIRATION}
    refresh:
      expiration: ${JWT_REFRESH_EXPIRATION}


aws:
  access-key: ${AWS_ACCESS_KEY_ID:tu-access-key}
  secret-key: ${AWS_SECRET_KEY:tu-secret-key}
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET:tu-bucket-name}
